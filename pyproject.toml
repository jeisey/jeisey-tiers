[project]
name = "ffdraft"
version = "0.1.0"
description = "Fantasy Draft Intelligence: intrinsic value tiers and market arbitrage from public football data"
readme = "README.md"
requires-python = ">=3.12"
# The dependency set stays deliberately small (AGENTS.md section 13). Phase 1 adds only
# what the scaffold, contracts, identity layer, adapters and artifact serializers need:
# pydantic for validated configuration, jsonschema (+ an RFC 3339 validator so `format:
# date-time` is actually asserted rather than ignored) for the public artifact contracts.
#
# Phase 3 adds exactly two modelling dependencies: LightGBM for the boosted-tree quantile
# candidate, and NumPy, which LightGBM requires anyway and which the metrics work in. The
# regularized baseline, the rank/probabilistic metrics and the paired bootstrap are written
# against NumPy rather than pulling in scikit-learn and SciPy for a closed-form ridge, two
# correlation coefficients and a percentile (ADR-024). `ruptures` still waits for Phase 4.
dependencies = [
    "jsonschema>=4.23",
    "lightgbm>=4.5",
    "nflreadpy>=0.1.5",
    "numpy>=2.0",
    "polars>=1.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "requests>=2.32",
    "rfc3339-validator>=0.1.4",
]

[project.scripts]
ffdraft = "ffdraft.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    # SciPy is already a hard LightGBM dependency. It is declared here as well so the
    # metric cross-check tests may import it honestly: the project's own Spearman, Kendall
    # tau-b and pinball implementations are checked against an independent implementation
    # as well as against hand-worked examples, without SciPy becoming production code.
    "scipy>=1.14",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffdraft"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff >= 0.16 formats Python blocks embedded in Markdown. The specification documents
# (MASTER_SPEC.md, docs/*.md) are a versioned contract that this project must not rewrite
# as a side effect of linting, so Markdown is excluded from both lint and format.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: hits third-party sources over the network; opt-in only (see docs/TEST_STRATEGY.md 2.4)",
]

[tool.mypy]
python_version = "3.12"
files = ["src/ffdraft"]
strict = true
# nflreadpy and rfc3339_validator ship no type information; everything we write is typed.
[[tool.mypy.overrides]]
module = ["nflreadpy.*", "rfc3339_validator.*"]
ignore_missing_imports = true
