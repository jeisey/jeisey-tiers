# Generate the Fantasy Football Calculator identity aliases against the LIVE population.
#
# `ffdraft link-market-source` proposes `FFC player_id -> canonical player_id` for a source
# that publishes no id bridge (ADR-061). It has to run where FFC is reachable, which is a
# runner: the development sandbox's egress policy denies the host (ADR-009, ADR-053).
#
# Unlike `source-probe-phase10.yml`, this workflow **writes**. The three files it produces
# are derived identity artifacts, not vendor data:
#
#   config/market-aliases/fantasyfootballcalculator_adp.yaml   the accepted aliases
#   docs/source-probes/<date>/<source>-linkage/report.json     coverage and the frozen rule
#   docs/source-probes/<date>/<source>-linkage/quarantine.csv  the human review list
#
# The alias file is what makes production capture an id lookup rather than a nightly fuzzy
# match, which is the property that lets a name-derived join exist here at all. The
# quarantine is the review list the roadmap's 90% gate is designed to leave behind.
#
# It must never gain a schedule. Regenerating aliases is a reviewable decision, and a
# regeneration that silently changed a player's identity overnight is exactly what the
# reviewed alias file (which outranks this one) exists to protect against.
name: phase10-linkage

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season to link
        type: string
        default: "2026"
      write:
        description: Commit the generated alias file and review artifacts
        type: boolean
        default: true
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - ".github/phase10-linkage.request"

permissions:
  contents: write

concurrency:
  group: phase10-linkage
  cancel-in-progress: false

env:
  UV_VERSION: "0.8.17"
  PYTHON_VERSION: "3.12"

jobs:
  link:
    name: Link FFC identities
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Read the linkage request
        id: request
        run: |
          set -euo pipefail
          season="${{ inputs.season }}"
          if [ -z "${season}" ]; then
            season="$(awk '/^season:/ {print $2}' .github/phase10-linkage.request)"
          fi
          echo "season=${season:-2026}" >> "$GITHUB_OUTPUT"

      - name: Link Fantasy Football Calculator identities
        id: link
        run: |
          set -euo pipefail
          uv run ffdraft link-market-source fantasyfootballcalculator_adp \
            --season "${{ steps.request.outputs.season }}" \
            --reviewed-by "phase10-linkage (github-actions)" \
            | tee linkage.log
        continue-on-error: true

      - name: Show what changed
        run: |
          git --no-pager diff --stat || true
          git status --porcelain

      - name: Commit the aliases and the review artifacts
        id: commit
        if: ${{ github.event_name == 'push' || inputs.write }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/market-aliases docs/source-probes
          if git diff --cached --quiet; then
            echo "The linkage produced no change (idempotent re-run)."
            exit 0
          fi
          git commit -m "$(printf 'data(phase-10): regenerate the FFC identity aliases\n\nGenerated by `ffdraft link-market-source` against the live FFC population.\nThe alias file is what makes production capture an id lookup rather than a\nnightly fuzzy match; the quarantine is the review list the 90%% gate leaves\nbehind. A human correction belongs in config/identity-aliases.yaml, which\noutranks this file and which a regeneration cannot overwrite.')"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Summary
        if: always()
        run: |
          {
            echo '## Phase-10 FFC identity linkage'
            echo
            echo "Season: ${{ steps.request.outputs.season }}"
            echo
            echo 'The coverage figure below is the **build-continuation gate** (roadmap 10.2).'
            echo 'A `FAIL` means candidate generation needs improving before FFC may price'
            echo 'a published board — it is not a threshold to lower.'
            echo
            echo '```'
            cat linkage.log 2>/dev/null || echo 'the linkage produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
