# Smoke the deployed site, from outside it.
#
# `daily-refresh.yml` verifies the build it is *about to* publish, which is the right place for
# a gate: a failure there means no deploy, and the previous site keeps serving (ADR-050). What
# nothing checked is the site **after** `actions/deploy-pages` has run. A build that is correct
# on disk can still be served from the wrong base path, or miss a file the packager never
# copied, and every gate in the refresh would have been green.
#
# This workflow is deliberately **not** part of that job graph. It gates nothing, deploys
# nothing, and runs only when someone asks for it, so adding it changes no production
# behaviour — the release checklist needed a way to check a live URL and the development
# sandbox cannot reach one (ADR-009), which is the same reason the source probes live on a
# runner.
#
# It needs no secret. Everything it reads, including the artifacts it compares the page
# against, is downloaded from the public site itself.
name: live-smoke

on:
  workflow_dispatch:
    inputs:
      url:
        description: The deployed site to smoke, without a trailing slash
        type: string
        default: https://jeisey.github.io/jeisey-tiers
      dump_data:
        description: >-
          Also print the served JSON artifacts (xz, base64) into the probe log, so a
          development sandbox that cannot reach the site can measure the exact public bytes.
        type: boolean
        default: false
      probe_only:
        description: >-
          Run only the hosting probe (headers, compression, conditional requests, payload
          composition) and skip the browser smoke.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # How GitHub Pages actually serves this site (ADR-098): the compression it negotiates for
  # each file type, its Cache-Control, ETag and Last-Modified, whether a conditional request is
  # answered 304, and what the served payload is made of, field by field. It observes only;
  # the numbers it prints are recorded in docs/OPERATIONS.md section 17.
  probe:
    name: Hosting and payload probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Response headers, compression and conditional requests
        run: node scripts/pages_probe.mjs headers --url "${SITE}" --out probe
        env:
          SITE: ${{ inputs.url }}

      - name: Payload composition of the served data
        run: node scripts/pages_probe.mjs fields --data probe/data | tee probe/fields.json

      - name: Print the served JSON (public bytes) for offline measurement
        if: ${{ inputs.dump_data == true }}
        run: |
          set -euo pipefail
          tar -C probe/data -cf - $(cd probe/data && ls *.json) | xz -9e | base64 -w 2000 > probe/data.tar.xz.b64
          echo "lines=$(wc -l < probe/data.tar.xz.b64) sha256=$(sha256sum probe/data.tar.xz.b64 | cut -c1-64)"
          echo "----- BEGIN DATA -----"
          cat probe/data.tar.xz.b64
          echo "----- END DATA -----"

      - name: Upload the probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-probe-${{ github.run_id }}
          path: probe
          if-no-files-found: warn
          retention-days: 7

  smoke:
    name: Deployed-site smoke
    if: ${{ inputs.probe_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # `persist-credentials: false`: this job only needs the verifier scripts, and it spends
      # the rest of its life talking to a public URL (docs/SECURITY_LICENSE.md section 3).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Assets, artifacts, the logo, the icons, the fonts, the three views, a player card, a
      # shared link across a reload, a phone, and the no-request-leaves-the-origin rule. This
      # also downloads what the site serves into `live-artifacts/`, which every step below
      # compares against — so the comparison is against the bytes that page was actually
      # served rather than against a local rebuild that might differ.
      - name: Resources, assets and primary flows
        run: node web/tests/e2e/verify-live.mjs --url "${SITE}" --out live-artifacts
        env:
          SITE: ${{ inputs.url }}

      - name: Rendered board against the served artifact bytes
        run: npm run verify:board -- --url "${SITE}" --data live-artifacts
        env:
          SITE: ${{ inputs.url }}

      # All nine blocks programmatically, plus a deeper measured review of three
      # representative permutations at desktop and mobile. The review prints the rendered top
      # ten beside the artifact's own, the masthead's boxes, both CSV labels' centring and the
      # document's overflow — numbers a reader of this log can check — and writes screenshots
      # for a human beside them, taken from the same navigation so the two cannot describe
      # different pages.
      - name: All nine presets, and a measured review of three
        run: |
          npm run verify:presets -- --url "${SITE}" --data live-artifacts \
            --review "PPR/redraft-12,HALF/redraft-10,STD/redraft-14" \
            --screens live-artifacts/screens
        env:
          SITE: ${{ inputs.url }}

      - name: Both CSV exports on both boards
        run: npm run verify:csv -- --url "${SITE}" --data live-artifacts
        env:
          SITE: ${{ inputs.url }}

      - name: Summarise the smoke
        if: always()
        run: |
          {
            echo '## Deployed-site smoke'
            echo
            echo "Target: <${{ inputs.url }}>"
            echo
            echo "| check | result |"
            echo "|---|---|"
            echo "| resources, assets, flows | see \`verify-live\` above |"
            echo "| rendered board vs served bytes | \`verify:board\` |"
            echo "| nine preset blocks | \`verify:presets\` |"
            echo "| four CSV exports | \`verify:csv\` |"
            echo
            echo "Job result: \`${{ job.status }}\`. Nothing here gates a deploy; a failure means"
            echo "the live site needs attention, not that a build was blocked."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload what the site served
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-${{ github.run_id }}
          path: live-artifacts
          if-no-files-found: warn
          retention-days: 7
