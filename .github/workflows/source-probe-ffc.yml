# On-demand feasibility probe for ONE candidate source.
#
# `source-probe.yml` is the Phase-0 evidence generator and drives `scripts/source_probe.py`
# against the sources this project already uses. This file is separate on purpose: it probes
# a *candidate*, on demand, and must never be confused with the Phase-0 evidence trail.
#
# `AGENTS.md` section 5: a source marked `verify_before_use` cannot become a production
# dependency until the check is completed and documented, and "never invent an endpoint or
# schema". This workflow is where that check runs, because the development sandbox's egress
# policy denies most vendor hosts (ADR-009, ADR-053) and a probe that cannot reach the source
# is not a probe.
#
# It is deliberately inert: dispatch-only, `contents: read`, no store credential, no vendor
# secret, no artifact, and nothing written anywhere. Its whole output is the job log, which a
# human reads and then writes into `docs/DATA_SOURCES.md` and an ADR.
#
# It must never gain a schedule. A probe that runs on a timer is an undeclared production
# dependency on a source whose terms have not been reviewed.
name: source-probe-ffc

on:
  workflow_dispatch:
    inputs:
      source:
        description: Which source to probe
        type: choice
        options:
          - fantasy-football-calculator
        default: fantasy-football-calculator

permissions:
  contents: read

concurrency:
  group: source-probe-ffc
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.17"
  PYTHON_VERSION: "3.12"

jobs:
  probe:
    name: Probe a candidate source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes, and the probe runs third-party requests in this workspace.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Probe Fantasy Football Calculator
        if: ${{ inputs.source == 'fantasy-football-calculator' }}
        run: uv run python scripts/probe_ffc.py | tee probe.log

      - name: Summary
        if: always()
        run: |
          {
            echo '## Source probe — ${{ inputs.source }}'
            echo
            echo 'Findings below are **not** a decision. They belong in `docs/DATA_SOURCES.md`'
            echo 'and an ADR before this source may be used for anything.'
            echo
            echo '```'
            cat probe.log 2>/dev/null || echo 'the probe produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
