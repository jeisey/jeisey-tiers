# Phase-0 evidence generator.
#
# The probe has to reach MyFantasyLeague, Sleeper, FantasyCalc and the nflverse release
# hosts. Development sandboxes may sit behind a restrictive egress policy (see
# docs/DECISIONS.md ADR-009), so a GitHub-hosted runner is the reference environment for
# source verification. This workflow is Phase-0 infrastructure only; `ci.yml`,
# `daily-refresh.yml` and `retrain.yml` remain Phase-7 deliverables.
name: source-probe

on:
  workflow_dispatch:
    inputs:
      commit_results:
        description: Commit the probe report back to the branch
        type: boolean
        default: true
      current_year:
        description: Market season to treat as current
        type: string
        default: "2026"
  push:
    branches:
      - "claude/phase-0-**"
    # Only the probe's own inputs retrigger it; the report it commits lives under docs/
    # and tests/fixtures/, so a results commit cannot cause a loop.
    paths:
      - "scripts/source_probe.py"
      - ".github/workflows/source-probe.yml"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: source-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Narrow write scope: the job commits its own evidence to the feature branch.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installing uv from PyPI keeps this to official actions plus a pinned pip install,
      # per docs/SECURITY_LICENSE.md section 4/5 (no curl | bash, no unpinned third party).
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.8.17"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint and unit-test the probe
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest

      - name: Run source probe
        id: probe
        env:
          PROBE_DATE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          out_dir="docs/source-probes/$(date -u +%F)"
          echo "out_dir=${out_dir}" >> "$GITHUB_OUTPUT"
          uv run python scripts/source_probe.py \
            --out "${out_dir}" \
            --current-year "${{ inputs.current_year || '2026' }}" \
            --sleep 1.0
          {
            echo '## Source probe'
            echo
            cat "${out_dir}/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: source-probe-${{ github.run_id }}
          path: |
            ${{ steps.probe.outputs.out_dir }}
            tests/fixtures/source_schemas
          if-no-files-found: error
          retention-days: 30

      - name: Commit probe evidence
        if: github.event_name == 'push' || inputs.commit_results
        env:
          OUT_DIR: ${{ steps.probe.outputs.out_dir }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${OUT_DIR}" tests/fixtures/source_schemas
          if git diff --cached --quiet; then
            echo "No probe evidence changes to commit."
            exit 0
          fi
          git commit -m "chore(phase-0): record source probe evidence from runner [skip ci]"
          # The branch may have moved on while the probe ran; rebase rather than force.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
