# The versioned venue registry (ADR-099; docs/DATA_SOURCES.md §20).
#
# One entry per building. A schedule row resolves by stadium NAME first (aliases, within the
# entry's seasons), then by nflverse stadium id (schedule_ids, within its seasons); zero or two
# matches resolve to nothing, and that game's weather is unknown (ffdraft.weekly.venues).
#
# roof_type is the venue's FIXED type, never a game's roof state:
#   open        weather reaches the field in every state
#   retractable the state is announced on game day: weather is unknown before it
#   dome        no weather reaches the field
#   unverified  the evidence does not establish which; fails closed (no roof type, no weather)
#
# Coordinates are Wikidata P625 (CC0) of the item the English Wikipedia article links,
# rounded to 4 decimals (about 11 m); tests/unit/test_venue_registry.py checks each against
# the committed probe evidence. Provenance cites that evidence; nothing is from memory.
#
# venues_v2 (2026-10-01): the Melbourne Cricket Ground and the Stade de France, unverified in
# v1, are open, on the roof documents (each quotation is checked against them verbatim).
registry_version: venues_v2
retrieved_utc: "2026-10-01"
evidence:
  - docs/source-probes/2026-10-01/weather/venues.json
  - docs/source-probes/2026-10-01/weather/venue_resolution.json
  - docs/source-probes/2026-10-01/weather/roof_documents.json
