schema_version: "1.3"
research_as_of: "2026-08-12"
# Phase-0 live verification. Every `verified: true` entry below was proved by
# scripts/source_probe.py; the evidence is docs/source-probes/2026-08-17/report.json and the
# human-readable record is docs/DATA_SOURCES.md section 13.
phase0_verified_as_of: "2026-08-17"
phase0_evidence: "docs/source-probes/2026-08-17/report.json"
phase0_probe_environment: "github-actions ubuntu-latest (see docs/DECISIONS.md ADR-009)"
# Human decisions recorded 2026-08-18 by the project owner (see docs/DECISIONS.md):
#   ADR-014 amendment - FantasyPros-derived ECR moves disabled -> benchmark_only.
#   ADR-016 - repository stays private through Phase 6.
#   ADR-017 - MFL developer client provisioned; env-variable NAMES recorded below, never values.
#   ADR-012 amendment - re-measure MFL cohort mix at the start of Phase 5.
owner_decisions_as_of: "2026-08-18"
# Phase-5 decisions (2026-08-20, see docs/DECISIONS.md):
#   ADR-038 - point-in-time captures live on the long-lived `market-data` branch.
#   ADR-039 - the cohort sufficiency rule and its selection policy, frozen before measurement.
#   ADR-040 - A0, the deterministic arbitrage baseline.
#   ADR-041 - `confidence` is market-data quality, not a probability.
#   ADR-042 - trend is a trailing 7-day slope over our own retained snapshots.
#   ADR-043 - current player status is a separate, annotation-only artifact.
#   ADR-044 - richer historical injury features are a 2027 refresh candidate.
phase5_decisions_as_of: "2026-08-20"
# Phase-7 decisions (2026-08-22, see docs/DECISIONS.md):
#   ADR-016 amendment - the application repository is now PUBLIC and serves a public Pages site.
#   ADR-049 - the retained capture store moved to a separate PRIVATE repository, because a
#             public repository has no private branch. The store's semantics are unchanged.
#   ADR-050 - production deployment: last-known-good Pages, job-graph gating, concurrency.
phase7_decisions_as_of: "2026-08-22"
policy_states:
  - production_allowed
  - allowed_optional
  - benchmark_only
  - verify_before_use
  - disabled
  - paid_optional
# Global decisions derived from the Phase-0 evidence.
decisions:
  arbitrage_ml_historical_feasible: false
  arbitrage_mode: baseline
  arbitrage_ml_revisit_rule: >-
    Revisit only after >= 3 draft seasons of our own append-only point-in-time market
    snapshots exist (ADR-006/ADR-010). Historical MFL ADP is dense but not point-in-time.
  current_status_sources: [nflreadpy_rosters, nflreadpy_depth_charts, sleeper]
  market_identity_bridges: [espn_id_via_nflverse_rosters, mfl_id_via_ff_playerids]
  non_commercial_deployment_required_by: [sleeper, fantasypros_ecr_via_dynastyprocess]
  # Sources permitted for internal comparison only. Nothing here may reach a public
  # artifact, an intrinsic feature, or any DraftValue input.
  benchmark_only_sources: [fantasypros_ecr_via_dynastyprocess]
  # ADR-016 as amended 2026-08-22 (Phase 7). The application repository is public and serves
  # a public GitHub Pages project site. The retained source history is NOT here; see
  # `market_history_repository` below and ADR-049.
  repository_visibility: public
  repository_visibility_decision_ref: "docs/DECISIONS.md ADR-016"
  repository_visibility_decided_phase: 7
  market_cohort_remeasure_phase: 5
  market_cohort_remeasure_rule: >-
    Re-measure MFL scoring x league-size cohort counts before implementing the Phase-5
    market adapter. The 2026-08-17 counts came from only 410 aggregated drafts; peak-season
    samples may allow tighter preset matching than ADR-012 assumes. Until then use the
    widest reliable cohort, record the filters actually sent, and flag approximate cohorts.
  # Done. The measurement is reproducible offline from a retained snapshot rather than from
  # a live re-fetch, so its report can be regenerated and diffed against the evidence commit.
  market_cohort_remeasured_at: "2026-08-20"
  market_cohort_rule_version: phase5_cohort_v1
  market_cohort_report: "docs/market-cohorts/"
  # ADR-038 as amended by ADR-049. The store is still one immutable Git-backed append-only
  # history on a long-lived branch called `market-data`; what moved in Phase 7 is which
  # repository that branch lives in. It is now a SEPARATE PRIVATE repository, because the
  # application repository became public and a public repository has no private branch.
  #
  # This is the one place the location is written down. Workflows read it from here
  # (`.github/actions/market-data-store`) rather than repeating the literal, and
  # `tests/unit/test_source_registry.py` pins it.
  market_history_repository: jeisey/jeisey-tiers-market-data
  market_history_repository_visibility: private
  # A NAME, never a value (the ADR-017 convention).
  market_history_repository_secret_name: MARKET_DATA_REPO_TOKEN
  market_history_branch: market-data
  market_history_layout: "market/<source_id>/<season>/<YYYY-MM-DDTHH-MM-SSZ>/"
  status_history_layout: "status/<source_id>/<season>/<YYYY-MM-DDTHH-MM-SSZ>/"
  market_history_append_only: true
  # ADR-040/041/042. Versions travel with every build and every published card.
  arbitrage_method_version: a0_rank_gap_v1
  arbitrage_confidence_rubric_version: phase5_confidence_v1
  market_trend_rule_version: phase5_trend_v1
  # ADR-043/044. Sleeper status annotates a published row and never enters a model.
  player_status_artifact: player_status.json
  player_status_is_model_feature: false
  historical_injury_features_revisit: "2027 intrinsic refresh (ADR-044)"
sources:
  nflreadpy:
    policy: production_allowed
    verified: true
    verified_at: "2026-08-17"
    criticality: critical
    cost: free
    docs_url: "https://nflreadpy.nflverse.com/"
    repo_url: "https://github.com/nflverse/nflreadpy"
    update_schedule_url: "https://nflreadr.nflverse.com/articles/nflverse_data_schedule.html"
    verified_version: "0.1.5"
    license: "MIT (client code)"
    data_license: "nflverse data broadly CC-BY-4.0; FTN-derived subsets CC-BY-SA-4.0"
    license_evidence:
      - "https://raw.githubusercontent.com/nflverse/nflreadpy/main/LICENSE.md"
      - "https://raw.githubusercontent.com/nflverse/nflreadpy/main/README.md"
      - "https://raw.githubusercontent.com/nflverse/nflreadr/main/README.md"
    download_hosts:
      - "github.com/nflverse/nflverse-data/releases/download/"
      - "github.com/dynastyprocess/data/raw/master/files/"
      - "github.com/ffverse/ffopportunity/releases/download/"
      - "github.com/nflverse/espnscrapeR-data/raw/master/data/"
    client_settings:
      user_agent_env: NFLREADPY_USER_AGENT
      cache_env: NFLREADPY_CACHE
      cache_dir_env: NFLREADPY_CACHE_DIR
    roles:
      - player_stats
      - rosters
      - depth_charts
      - player_ids
      - draft_picks
      - combine
      - current_status
      - nextgen_stats_optional
      - pfr_advstats_optional
    verified_loaders:
      load_players: {rows: 25040}
      load_ff_playerids: {rows: 12472, gsis_id_coverage: 0.64, mfl_id_coverage: 1.0}
      load_teams: {rows: 36}
      load_draft_picks: {rows: 12927, seasons: all}
      load_combine: {rows: 8968, seasons: all}
      load_player_stats_reg: {"2012": 1811, "2019": 1889, "2024": 1997, "2025": 2020}
      load_player_stats_week: {"2025": 19422}
      load_rosters: {"2012": 2120, "2019": 3114, "2025": 3137, "2026": 2930}
      load_rosters_weekly: {"2019": 51632, "2025": 46849}
      load_depth_charts: {"2019": 36308, "2024": 37312, "2025": 554215, "2026": 442872}
      load_snap_counts: {"2019": 23862, "2025": 26612}
      load_injuries: {"2019": 5392, "2024": 6215, "2025": 6068}
      load_nextgen_stats_receiving: {"2025": 1402}
      load_pfr_advstats_rec_season: {"2025": 531}
      load_ftn_charting: {"2025": 47316}
      load_schedules: {"2026": 272}
    known_issues:
      - id: depth_chart_schema_break_2025
        detail: >-
          Pre-2025 depth charts are weekly rows (season/club_code/week/depth_team/
          depth_position); 2025+ are timestamped snapshots (dt/team/pos_abb/pos_rank/
          pos_slot). Two normalisation paths required. See ADR-015.
      - id: no_preseason_depth_before_2025
        detail: >-
          Pre-2025 depth charts start at week 1, so no draft-time anchor depth exists for
          those seasons. Week-1 data postdates the anchor and leaks. See ADR-015.
      - id: injuries_in_season_only
        detail: >-
          load_injuries returns weekly in-season reports and refuses seasons after 2025, so
          it cannot supply current preseason status. See ADR-011.
      - id: current_season_helper_lags
        detail: >-
          get_current_season() returned 2025 on 2026-08-17 while
          get_current_season(roster=True) returned 2026. Never derive the draft-target
          season from get_current_season().
      - id: ff_playerids_unlicensed_mirror
        detail: >-
          load_ff_playerids is served from the dynastyprocess mirror, which publishes no
          licence. Prefer nflverse-native ids; treat mfl_id as the secondary bridge.
  ffopportunity:
    policy: production_allowed
    verified: true
    verified_at: "2026-08-17"
    criticality: important
    cost: free
    docs_url: "https://ffopportunity.ffverse.com/"
    repo_url: "https://github.com/ffverse/ffopportunity"
    license: "package code GPL-3.0; expected-points models/data CC-BY-SA-4.0"
    license_evidence:
      - "https://raw.githubusercontent.com/ffverse/ffopportunity/main/DESCRIPTION"
      - "https://raw.githubusercontent.com/ffverse/ffopportunity/main/README.md"
    attribution_required: true
    share_alike_obligation: true
    roles:
      - expected_fantasy_points
      - expected_opportunity
    verified_loaders:
      load_ff_opportunity_weekly: {"2019": 5633, "2024": 6005, "2025": 6054}
    known_issues:
      - id: season_column_is_string
        detail: "season arrives as a string here but as an integer elsewhere; cast in the adapter."
  myfantasyleague_adp:
    policy: production_allowed
    verified: true
    verified_at: "2026-08-17"
    criticality: critical_for_arbitrage
    cost: free
    developer_info_url: "https://api.myfantasyleague.com/2026/api_info"
    api_base_url: "https://api.myfantasyleague.com/"
    verified_endpoints:
      current_adp: "https://api.myfantasyleague.com/{season}/export?TYPE=adp&JSON=1"
      player_db: "https://api.myfantasyleague.com/{season}/export?TYPE=players&DETAILS=1&JSON=1"
    documentation_2026: "https://www41.myfantasyleague.com/2026/api_info"
    authentication: none
    public_adp_requires_authentication: false
    # Environment-variable NAMES only. Values are GitHub repository secrets and must never
    # be printed, logged, committed, cached or serialised (ADR-017,
    # docs/SECURITY_LICENSE.md section 2). Only the User-Agent is ever transmitted.
    client_settings:
      developer_client_registered: true
      developer_client_registered_at: "2026-08-18"
      user_agent_env: MFL_API_USER_AGENT
      client_name_env: MFL_API_CLIENT_NAME
      # Present for MFL's authenticated league endpoints, which V1 does not call.
      username_env: MFL_API_USERNAME
      password_env: MFL_API_PASSWORD
      credentials_used_by_adp_adapter: false
      fallback_user_agent_when_unset: >-
        Descriptive contact User-Agent, plus an `unregistered_user_agent` warning. A missing
        secret degrades the request identity; it never blocks the unauthenticated export.
    license: >-
      Published developer rules state access "is provided free to anyone to use in almost any
      way", with harvesting league/user data, circumventing league rules, overloading the
      service and collecting user information without permission forbidden. None applies to
      reading the public ADP aggregate.
    obligations:
      - "Send the registered developer client's User-Agent from MFL_API_USER_AGENT (client registered 2026-08-18, ADR-017)."
      - "Handle HTTP 429 with backoff; MFL throttles over-limit clients."
      - "Request the player database no more than once per day and cache it."
      - "Do not request league or user data."
    robots_txt: "disallows /fflnetdynamic*/ league directories only; /{season}/export is not restricted"
    roles:
      - current_adp
    forbidden_roles:
      - historical_arbitrage_training_target
    response_fields:
      player: [id, rank, averagePick, minPick, maxPick, draftsSelectedIn, draftSelPct]
      envelope: [version, encoding, timestamp, totalDrafts, totalPicks]
    field_notes:
      adp_sd: "not provided; market_snapshot.adp_sd must be null"
      dispersion: "derive adp_low/adp_high from minPick/maxPick"
      sample_size: "draftsSelectedIn"
      timestamp: "response generation time, NOT a data-as-of time"
      player_ids: "no gsis_id; espn_id 82.1%, nfl_id 3.4%; team units (e.g. TMWR) must be filtered"
    verified_filters:
      honoured: [IS_PPR, FCOUNT, IS_MOCK, IS_KEEPER]
      accepted_no_effect: [CUTOFF]
      ignored: [DAYS]
    verified_cohort_counts_2026:
      unfiltered: 367
      is_ppr_1: 370
      is_ppr_0: 229
      fcount_10: 325
      fcount_12: 356
      fcount_14: 242
      is_ppr_0_and_fcount_10: 2
      no_mock_no_keeper: 383
    verified_history_rows:
      "2019": 445
      "2020": 442
      "2021": 397
      "2022": 391
      "2023": 416
      "2024": 413
      "2025": 362
    known_issues:
      - id: history_not_point_in_time
        detail: >-
          Historical responses are season-long aggregates recomputed at request time and
          DAYS is ignored (DAYS=30 on 2019 returned the unfiltered 445 rows / 15850 drafts),
          so draft-time market cost cannot be reconstructed. See ADR-010.
      - id: cohort_intersections_collapse
        detail: >-
          Scoring x league-size intersections can return almost nothing (IS_PPR=0&FCOUNT=10
          returned 2 players). Cohorts must be labelled approximate. See ADR-012.
  sleeper:
    policy: production_allowed
    verified: true
    verified_at: "2026-08-17"
    criticality: important
    cost: free_non_commercial_only
    docs_url: "https://docs.sleeper.com/"
    api_base_url: "https://api.sleeper.app/v1/"
    authentication: none
    license: >-
      Documented as a read-only API "free to use for non-commercial purposes"; commercial use
      requires contacting Sleeper for licensing. Trending data requests attribution.
    non_commercial_only: true
    rate_guidance: "stay under 1000 API calls per minute or risk an IP block (documented)"
    robots_txt: "no active restrictions (all directives commented out)"
    verified_endpoints:
      state: "https://api.sleeper.app/v1/state/nfl"
      players: "https://api.sleeper.app/v1/players/nfl"
      trending_add: "https://api.sleeper.app/v1/players/nfl/trending/add?lookback_hours=24&limit=25"
    roles:
      - current_player_map
      - current_status
      - current_injury_context
      - anchor_season_cross_check
      - trending_optional
    cadence_guidance: "player map at most once per day; payload is ~14.6 MB"
    verified_coverage:
      player_records: 12220
      payload_bytes: 14640182
      player_id_coverage: 1.0
      sportradar_id_coverage: 0.947
      espn_id_coverage: 0.551
      gsis_id_coverage: 0.319
      injury_status_populated: 0.051
    status_fields:
      - status
      - injury_status
      - injury_body_part
      - injury_notes
      - injury_start_date
      - practice_participation
      - practice_description
      - depth_chart_order
      - depth_chart_position
      - team_changed_at
    known_issues:
      - id: low_gsis_coverage
        detail: >-
          Only 31.9% of Sleeper records carry gsis_id, so join nflverse -> Sleeper on
          sleeper_id (82% present on current skill rosters), never the reverse.
      - id: whitespace_in_ids
        detail: >-
          Observed gsis_id values with a leading space (" 00-0035057"). Trim and validate
          ids; fail closed on malformed values.
  fantasycalc:
    policy: disabled
    verified: true
    verified_at: "2026-08-17"
    criticality: optional
    cost: n_a_disabled
    rankings_url: "https://fantasycalc.com/redraft-rankings"
    terms_url: "https://fantasycalc.com/terms-of-usage"
    decision_ref: "docs/DECISIONS.md ADR-013"
    decision_reason: >-
      No documented public API or published download mechanism, and the terms page is
      client-rendered (113878 bytes with no terms text in the served markup) so the policy
      cannot be verified programmatically. Reachability is not sanction.
    revisit_if:
      - "FantasyCalc publishes a documented reuse mechanism."
      - "A human records a reading of the current terms and any required written permission."
  fantasypros_ecr_via_dynastyprocess:
    policy: benchmark_only
    verified: true
    verified_at: "2026-08-17"
    policy_decided_at: "2026-08-18"
    criticality: optional
    cost: free_non_commercial_only
    non_commercial_only: true
    nflreadpy_loader: "load_ff_rankings(type='draft')"
    mirror_url: "https://github.com/dynastyprocess/data"
    decision_ref: "docs/DECISIONS.md ADR-014 (amended 2026-08-18)"
    decision_reason: >-
      The project owner manually reviewed the current FantasyPros terms on 2026-08-18 and
      approved use for this non-commercial project as an internal benchmark. The Phase-0
      blocker was the absence of a human terms reading, not a measured prohibition; the data
      itself was already verified reachable (5849 rows).
    permitted_roles:
      - internal_benchmark
    forbidden_roles:
      - intrinsic_feature
      - draftvalue_input
      - critical_production_dependency
      - public_artifact_field
      - public_redistribution
    redistribution_permitted: false
    redistribution_note: >-
      Approval to compare is not approval to republish. Raw FantasyPros ranking data must not
      appear in any public artifact unless the documented terms clearly permit that exact
      redistribution. The source probe continues to suppress benchmark-only rows.
    revisit_if:
      - "FantasyPros terms change."
      - "The deployment stops being non-commercial."
      - "A published metric would require redistributing the underlying ranking data."
  sportsdataio:
    policy: paid_optional
    verified: false
    criticality: optional
    cost: commercial
    nfl_url: "https://sportsdata.io/nfl-api"
    workflow_url: "https://sportsdata.io/developers/workflow-guide/nfl"
    roles:
      - injury_feed_upgrade
      - maintained_depth_charts
      - projection_baseline
      - news
      - odds_optional
    value_unlock: "operational reliability, maintained current-state feeds, SLA/support"
    phase0_note: "Not probed; no V1 dependency. Free stack covered every required role."
