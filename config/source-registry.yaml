schema_version: "1.4"
research_as_of: "2026-08-12"
# Phase-0 live verification. Every `verified: true` entry below was proved by
# scripts/source_probe.py; the evidence is docs/source-probes/2026-08-17/report.json and the
# human-readable record is docs/DATA_SOURCES.md section 13.
phase0_verified_as_of: "2026-08-17"
phase0_evidence: "docs/source-probes/2026-08-17/report.json"
phase0_probe_environment: "github-actions ubuntu-latest (see docs/DECISIONS.md ADR-009)"
# Human decisions recorded 2026-08-18 by the project owner (see docs/DECISIONS.md):
#   ADR-014 amendment - FantasyPros-derived ECR moves disabled -> benchmark_only.
#   ADR-016 - repository stays private through Phase 6.
#   ADR-017 - MFL developer client provisioned; env-variable NAMES recorded below, never values.
#   ADR-012 amendment - re-measure MFL cohort mix at the start of Phase 5.
owner_decisions_as_of: "2026-08-18"
# Phase-5 decisions (2026-08-20, see docs/DECISIONS.md):
#   ADR-038 - point-in-time captures live on the long-lived `market-data` branch.
#   ADR-039 - the cohort sufficiency rule and its selection policy, frozen before measurement.
#   ADR-040 - A0, the deterministic arbitrage baseline.
#   ADR-041 - `confidence` is market-data quality, not a probability.
#   ADR-042 - trend is a trailing 7-day slope over our own retained snapshots.
#   ADR-043 - current player status is a separate, annotation-only artifact.
#   ADR-044 - richer historical injury features are a 2027 refresh candidate.
phase5_decisions_as_of: "2026-08-20"
# Phase-7 decisions (2026-08-22, see docs/DECISIONS.md):
#   ADR-016 amendment - the application repository is now PUBLIC and serves a public Pages site.
#   ADR-049 - the retained capture store moved to a separate PRIVATE repository, because a
#             public repository has no private branch. The store's semantics are unchanged.
#   ADR-050 - production deployment: last-known-good Pages, job-graph gating, concurrency.
phase7_decisions_as_of: "2026-08-22"
# Phase-10 decisions (2026-09-02, see docs/DECISIONS.md):
#   ADR-060 - the Phase-10 source evidence, taken on a runner across four probe passes.
#   ADR-061 - FFC identity is a one-time reviewable linkage, not a nightly fuzzy match.
#   ADR-062 - Fantasy Football Calculator becomes a production ADP source.
#   ADR-063 - three universes replace `head(300)`; market data decides visibility only.
#   ADR-064 - FantasyPros is implemented and retained but NOT published: the provisioned
#             key is on the free tier, which caps every response at ten rows and exposes
#             no ADP endpoint at all.
#   ADR-065 - one independent comparison per source; the cross-market median is a summary.
#   ADR-066 - the market-trend chart reads a published artifact; the browser calls no vendor.
phase10_decisions_as_of: "2026-09-02"
phase10_evidence: "docs/source-probes/2026-09-02/phase10-report.md"
policy_states:
  - production_allowed
  - allowed_optional
  - benchmark_only
  - verify_before_use
  - disabled
  - paid_optional
# Global decisions derived from the Phase-0 evidence.
decisions:
  arbitrage_ml_historical_feasible: false
  arbitrage_mode: baseline
  arbitrage_ml_revisit_rule: >-
    Revisit only after >= 3 draft seasons of our own append-only point-in-time market
    snapshots exist (ADR-006/ADR-010). Historical MFL ADP is dense but not point-in-time.
  current_status_sources: [nflreadpy_rosters, nflreadpy_depth_charts, sleeper]
  market_identity_bridges: [espn_id_via_nflverse_rosters, mfl_id_via_ff_playerids]
  # Phase 10. Each source resolves a different way, and the difference is the reason the
  # capture path takes a spec rather than a flag (ADR-061, ADR-062, ADR-064).
  market_identity_strategies:
    myfantasyleague_adp: two_live_bridges_cross_checked
    fantasyfootballcalculator_adp: generated_alias_only
    fantasypros_ecr: two_live_bridges_cross_checked
  market_alias_directory: config/market-aliases/
  market_alias_precedence: >-
    config/identity-aliases.yaml (human-reviewed) is loaded LAST and wins. A generated file
    is a machine's reading of a name; a reviewed entry is a person's decision about a
    player, usually written because the automatic path could not see him (ADR-019/054/061).
  non_commercial_deployment_required_by: [sleeper, fantasypros_ecr_via_dynastyprocess]
  # Sources permitted for internal comparison only. Nothing here may reach a public
  # artifact, an intrinsic feature, or any DraftValue input.
  benchmark_only_sources: [fantasypros_ecr_via_dynastyprocess]
  # ADR-016 as amended 2026-08-22 (Phase 7). The application repository is public and serves
  # a public GitHub Pages project site. The retained source history is NOT here; see
  # `market_history_repository` below and ADR-049.
  repository_visibility: public
  repository_visibility_decision_ref: "docs/DECISIONS.md ADR-016"
  repository_visibility_decided_phase: 7
  market_cohort_remeasure_phase: 5
  market_cohort_remeasure_rule: >-
    Re-measure MFL scoring x league-size cohort counts before implementing the Phase-5
    market adapter. The 2026-08-17 counts came from only 410 aggregated drafts; peak-season
    samples may allow tighter preset matching than ADR-012 assumes. Until then use the
    widest reliable cohort, record the filters actually sent, and flag approximate cohorts.
  # Done. The measurement is reproducible offline from a retained snapshot rather than from
  # a live re-fetch, so its report can be regenerated and diffed against the evidence commit.
  market_cohort_remeasured_at: "2026-08-20"
  market_cohort_rule_version: phase5_cohort_v1
  market_cohort_report: "docs/market-cohorts/"
  # ADR-038 as amended by ADR-049. The store is still one immutable Git-backed append-only
  # history on a long-lived branch called `market-data`; what moved in Phase 7 is which
  # repository that branch lives in. It is now a SEPARATE PRIVATE repository, because the
  # application repository became public and a public repository has no private branch.
  #
  # This is the one place the location is written down. Workflows read it from here
  # (`.github/actions/market-data-store`) rather than repeating the literal, and
  # `tests/unit/test_source_registry.py` pins it.
  market_history_repository: jeisey/jeisey-tiers-market-data
  market_history_repository_visibility: private
  # A NAME, never a value (the ADR-017 convention).
  market_history_repository_secret_name: MARKET_DATA_REPO_TOKEN
  market_history_branch: market-data
  market_history_layout: "market/<source_id>/<season>/<YYYY-MM-DDTHH-MM-SSZ>/"
  status_history_layout: "status/<source_id>/<season>/<YYYY-MM-DDTHH-MM-SSZ>/"
  market_history_append_only: true
  # ADR-040/041/042. Versions travel with every build and every published card.
  arbitrage_method_version: a0_rank_gap_v1
  arbitrage_confidence_rubric_version: phase5_confidence_v1
  market_trend_rule_version: phase5_trend_v1
  # ADR-063. `head(300)` was three decisions wearing one number. The intrinsic universe is
  # market-blind and unchanged; tier segmentation runs over a versioned depth; the public
  # surface admits a player either the model or current market evidence says matters. A
  # market signal changes VISIBILITY only - never a projection, VORP, fair rank or tier.
  tier_depth_rule_version: phase10_tier_depth_v2
  tier_depth_rule_v1_version: phase4_tier_depth_v1
  surface_rule_version: phase10_surface_v1
  market_top_surface_depth: 300
  market_top_surface_coverage_required: 1.0
  # ADR-065/066. Versions travel with every published comparison and every chart series.
  market_comparison_method_version: phase10_multimarket_v1
  market_trend_series_artifact: market_trend_series.json
  # ADR-061. The frozen linkage rule and the gate it must clear.
  market_linkage_rule_version: phase10_linkage_v1
  market_linkage_min_coverage: 0.90
  # ADR-043/044. Sleeper status annotates a published row and never enters a model.
  player_status_artifact: player_status.json
  player_status_is_model_feature: false
  historical_injury_features_revisit: "2027 intrinsic refresh (ADR-044)"
sources:
  nflreadpy:
    policy: production_allowed
    verified: true
    verified_at: "2026-08-17"
    criticality: critical
    cost: free
    docs_url: "https://nflreadpy.nflverse.com/"
    repo_url: "https://github.com/nflverse/nflreadpy"
    update_schedule_url: "https://nflreadr.nflverse.com/articles/nflverse_data_schedule.html"
    verified_version: "0.1.5"
    license: "MIT (client code)"
    data_license: "nflverse data broadly CC-BY-4.0; FTN-derived subsets CC-BY-SA-4.0"
    license_evidence:
      - "https://raw.githubusercontent.com/nflverse/nflreadpy/main/LICENSE.md"
      - "https://raw.githubusercontent.com/nflverse/nflreadpy/main/README.md"
      - "https://raw.githubusercontent.com/nflverse/nflreadr/main/README.md"
    download_hosts:
      - "github.com/nflverse/nflverse-data/releases/download/"
      - "github.com/dynastyprocess/data/raw/master/files/"
      - "github.com/ffverse/ffopportunity/releases/download/"
      - "github.com/nflverse/espnscrapeR-data/raw/master/data/"
    client_settings:
      user_agent_env: NFLREADPY_USER_AGENT
      cache_env: NFLREADPY_CACHE
      cache_dir_env: NFLREADPY_CACHE_DIR
    roles:
      - player_stats
      - rosters
      - depth_charts
      - player_ids
      - draft_picks
      - combine
      - current_status
      - nextgen_stats_optional
      - pfr_advstats_optional
    verified_loaders:
      load_players: {rows: 25040}
      load_ff_playerids: {rows: 12472, gsis_id_coverage: 0.64, mfl_id_coverage: 1.0}
      load_teams: {rows: 36}
      load_draft_picks: {rows: 12927, seasons: all}
      load_combine: {rows: 8968, seasons: all}
      load_player_stats_reg: {"2012": 1811, "2019": 1889, "2024": 1997, "2025": 2020}
      load_player_stats_week: {"2025": 19422}
      load_rosters: {"2012": 2120, "2019": 3114, "2025": 3137, "2026": 2930}
      load_rosters_weekly: {"2019": 51632, "2025": 46849}
      load_depth_charts: {"2019": 36308, "2024": 37312, "2025": 554215, "2026": 442872}
      load_snap_counts: {"2019": 23862, "2025": 26612}
      load_injuries: {"2019": 5392, "2024": 6215, "2025": 6068}
      load_nextgen_stats_receiving: {"2025": 1402}
      load_pfr_advstats_rec_season: {"2025": 531}
      load_ftn_charting: {"2025": 47316}
      load_schedules: {"2026": 272}
    known_issues:
      - id: depth_chart_schema_break_2025
        detail: >-
          Pre-2025 depth charts are weekly rows (season/club_code/week/depth_team/
          depth_position); 2025+ are timestamped snapshots (dt/team/pos_abb/pos_rank/
          pos_slot). Two normalisation paths required. See ADR-015.
      - id: no_preseason_depth_before_2025
        detail: >-
          Pre-2025 depth charts start at week 1, so no draft-time anchor depth exists for
          those seasons. Week-1 data postdates the anchor and leaks. See ADR-015.
      - id: injuries_in_season_only
        detail: >-
          load_injuries returns weekly in-season reports and refuses seasons after 2025, so
          it cannot supply current preseason status. See ADR-011.
      - id: current_season_helper_lags
        detail: >-
          get_current_season() returned 2025 on 2026-08-17 while
          get_current_season(roster=True) returned 2026. Never derive the draft-target
          season from get_current_season().
      - id: ff_playerids_unlicensed_mirror
        detail: >-
          load_ff_playerids is served from the dynastyprocess mirror, which publishes no
          licence. Prefer nflverse-native ids; treat mfl_id as the secondary bridge.
  ffopportunity:
    policy: production_allowed
    verified: true
    verified_at: "2026-08-17"
    criticality: important
    cost: free
    docs_url: "https://ffopportunity.ffverse.com/"
    repo_url: "https://github.com/ffverse/ffopportunity"
    license: "package code GPL-3.0; expected-points models/data CC-BY-SA-4.0"
    license_evidence:
      - "https://raw.githubusercontent.com/ffverse/ffopportunity/main/DESCRIPTION"
      - "https://raw.githubusercontent.com/ffverse/ffopportunity/main/README.md"
    attribution_required: true
    share_alike_obligation: true
    roles:
      - expected_fantasy_points
      - expected_opportunity
    verified_loaders:
      load_ff_opportunity_weekly: {"2019": 5633, "2024": 6005, "2025": 6054}
    known_issues:
      - id: season_column_is_string
        detail: "season arrives as a string here but as an integer elsewhere; cast in the adapter."
  myfantasyleague_adp:
    policy: production_allowed
    verified: true
    verified_at: "2026-08-17"
    criticality: critical_for_arbitrage
    cost: free
    developer_info_url: "https://api.myfantasyleague.com/2026/api_info"
    api_base_url: "https://api.myfantasyleague.com/"
    verified_endpoints:
      current_adp: "https://api.myfantasyleague.com/{season}/export?TYPE=adp&JSON=1"
      player_db: "https://api.myfantasyleague.com/{season}/export?TYPE=players&DETAILS=1&JSON=1"
    documentation_2026: "https://www41.myfantasyleague.com/2026/api_info"
    authentication: none
    public_adp_requires_authentication: false
    # Environment-variable NAMES only. Values are GitHub repository secrets and must never
    # be printed, logged, committed, cached or serialised (ADR-017,
    # docs/SECURITY_LICENSE.md section 2). Only the User-Agent is ever transmitted.
    client_settings:
      developer_client_registered: true
      developer_client_registered_at: "2026-08-18"
      user_agent_env: MFL_API_USER_AGENT
      client_name_env: MFL_API_CLIENT_NAME
      # Present for MFL's authenticated league endpoints, which V1 does not call.
      username_env: MFL_API_USERNAME
      password_env: MFL_API_PASSWORD
      credentials_used_by_adp_adapter: false
      fallback_user_agent_when_unset: >-
        Descriptive contact User-Agent, plus an `unregistered_user_agent` warning. A missing
        secret degrades the request identity; it never blocks the unauthenticated export.
    license: >-
      Published developer rules state access "is provided free to anyone to use in almost any
      way", with harvesting league/user data, circumventing league rules, overloading the
      service and collecting user information without permission forbidden. None applies to
      reading the public ADP aggregate.
    obligations:
      - "Send the registered developer client's User-Agent from MFL_API_USER_AGENT (client registered 2026-08-18, ADR-017)."
      - "Handle HTTP 429 with backoff; MFL throttles over-limit clients."
      - "Request the player database no more than once per day and cache it."
      - "Do not request league or user data."
    robots_txt: "disallows /fflnetdynamic*/ league directories only; /{season}/export is not restricted"
    roles:
      - current_adp
    forbidden_roles:
      - historical_arbitrage_training_target
    response_fields:
      player: [id, rank, averagePick, minPick, maxPick, draftsSelectedIn, draftSelPct]
      envelope: [version, encoding, timestamp, totalDrafts, totalPicks]
    field_notes:
      adp_sd: "not provided; market_snapshot.adp_sd must be null"
      dispersion: "derive adp_low/adp_high from minPick/maxPick"
      sample_size: "draftsSelectedIn"
      timestamp: "response generation time, NOT a data-as-of time"
      player_ids: "no gsis_id; espn_id 82.1%, nfl_id 3.4%; team units (e.g. TMWR) must be filtered"
    verified_filters:
      honoured: [IS_PPR, FCOUNT, IS_MOCK, IS_KEEPER]
      accepted_no_effect: [CUTOFF]
      ignored: [DAYS]
    verified_cohort_counts_2026:
      unfiltered: 367
      is_ppr_1: 370
      is_ppr_0: 229
      fcount_10: 325
      fcount_12: 356
      fcount_14: 242
      is_ppr_0_and_fcount_10: 2
      no_mock_no_keeper: 383
    verified_history_rows:
      "2019": 445
      "2020": 442
      "2021": 397
      "2022": 391
      "2023": 416
      "2024": 413
      "2025": 362
    known_issues:
      - id: history_not_point_in_time
        detail: >-
          Historical responses are season-long aggregates recomputed at request time and
          DAYS is ignored (DAYS=30 on 2019 returned the unfiltered 445 rows / 15850 drafts),
          so draft-time market cost cannot be reconstructed. See ADR-010.
      - id: cohort_intersections_collapse
        detail: >-
          Scoring x league-size intersections can return almost nothing (IS_PPR=0&FCOUNT=10
          returned 2 players). Cohorts must be labelled approximate. See ADR-012.
  sleeper:
    policy: production_allowed
    verified: true
    verified_at: "2026-08-17"
    criticality: important
    cost: free_non_commercial_only
    docs_url: "https://docs.sleeper.com/"
    api_base_url: "https://api.sleeper.app/v1/"
    authentication: none
    license: >-
      Documented as a read-only API "free to use for non-commercial purposes"; commercial use
      requires contacting Sleeper for licensing. Trending data requests attribution.
    non_commercial_only: true
    rate_guidance: "stay under 1000 API calls per minute or risk an IP block (documented)"
    robots_txt: "no active restrictions (all directives commented out)"
    verified_endpoints:
      state: "https://api.sleeper.app/v1/state/nfl"
      players: "https://api.sleeper.app/v1/players/nfl"
      trending_add: "https://api.sleeper.app/v1/players/nfl/trending/add?lookback_hours=24&limit=25"
    roles:
      - current_player_map
      - current_status
      - current_injury_context
      - anchor_season_cross_check
      - trending_optional
      - trending_add_drop_retained_for_phase12
    cadence_guidance: "player map at most once per day; payload is ~14.0 MiB"
    # Re-measured 2026-09-02 (ADR-060). Payload size is an operational fact, not a schema
    # contract: it moved by 11 KB and six records in a year. The ONCE-PER-DAY maximum is the
    # rule that matters and is unchanged.
    remeasured_at: "2026-09-02"
    remeasured_coverage:
      player_records: 12226
      payload_bytes: 14651318
      core_position_records: 4041
      player_id_coverage: 1.0
      sportradar_id_coverage: 0.948
      yahoo_id_coverage: 0.559
      espn_id_coverage: 0.547
      gsis_id_coverage: 0.312
      search_rank_coverage: 0.974
    verified_coverage:
      player_records: 12220
      payload_bytes: 14640182
      player_id_coverage: 1.0
      sportradar_id_coverage: 0.947
      espn_id_coverage: 0.551
      gsis_id_coverage: 0.319
      injury_status_populated: 0.051
    status_fields:
      - status
      - injury_status
      - injury_body_part
      - injury_notes
      - injury_start_date
      - practice_participation
      - practice_description
      - depth_chart_order
      - depth_chart_position
      - team_changed_at
    known_issues:
      - id: low_gsis_coverage
        detail: >-
          Only 31.9% of Sleeper records carry gsis_id, so join nflverse -> Sleeper on
          sleeper_id (82% present on current skill rosters), never the reverse.
      - id: search_rank_is_not_adp
        detail: >-
          `search_rank` is populated on 97.4% of core records and is NOT an average draft
          position. Roadmap 10.1.4 forbids using it as pseudo-ADP; it is recorded here so
          its presence is on the record and cannot be rediscovered as an opportunity.
      - id: trending_rows_carry_no_metadata
        detail: >-
          `trending/{add,drop}` returns a BARE JSON list of {player_id, count} with no
          envelope and no timestamp. A retained snapshot must record the `lookback_hours`
          and `limit` it REQUESTED, or the counts are uninterpretable later. Both were
          measured as honoured on 2026-09-02 (limit exactly; 6h vs 24h shared 24 of 25 ids).
      - id: whitespace_in_ids
        detail: >-
          Observed gsis_id values with a leading space (" 00-0035057"). Trim and validate
          ids; fail closed on malformed values.
  fantasyfootballcalculator_adp:
    policy: production_allowed
    verified: true
    verified_at: "2026-09-02"
    criticality: important
    cost: free
    decision_ref: "docs/DECISIONS.md ADR-062 (supersedes ADR-053's deferral; confirms ADR-056)"
    evidence: "docs/source-probes/2026-09-02/phase10-report.md section 1"
    docs_url: "https://help.fantasyfootballcalculator.com/article/42-adp-rest-api"
    api_base_url: "https://fantasyfootballcalculator.com/api/v1/adp/"
    authentication: none
    verified_endpoints:
      adp: "https://fantasyfootballcalculator.com/api/v1/adp/{format}?teams=12&year={season}&position=all"
    license: >-
      The publisher's ADP REST API terms permit use with attribution and ask clients not to
      poll unnecessarily. A production refresh fetches once per day per scoring cohort and
      every downstream stage reads the retained snapshot.
    attribution_required: true
    attribution_surface: "frontend Data view, section 07 Sources and attribution"
    obligations:
      - "Attribute Fantasy Football Calculator wherever its ADP is displayed."
      - "Send a descriptive, contactable User-Agent; the source has no developer registration."
      - "One request per scoring cohort per day. Do not poll."
      - "Never claim a league size: `teams` is accepted and ignored (see below)."
    roles:
      - current_adp
    forbidden_roles:
      - intrinsic_feature
      - historical_arbitrage_training_target
      - league_size_cohort
    response_fields:
      envelope: [status, meta, players]
      meta: [type, teams, rounds, total_drafts, start_date, end_date]
      player: [player_id, name, position, team, adp, adp_formatted, times_drafted, high, low, stdev, bye]
    field_notes:
      adp_sd: "`stdev` is a GENUINE per-player standard deviation, 221/221 populated, 0.60-31.90"
      dispersion: >-
        `high`/`low` are extreme order statistics and occupy min_pick/max_pick. They are a
        DIFFERENT quantity from `stdev` and must never share a column with it.
      high_low_orientation: >-
        FFC's table reads "High" for the EARLIEST pick, which is the smaller number. The
        adapter orders the pair numerically rather than trusting the label, so it is correct
        under either convention, and counts the observed orientation into the manifest.
      source_as_of: >-
        `meta.start_date`/`end_date` bound a WINDOW, not an instant. source_as_of_utc stays
        null; promoting a date to a timestamp would manufacture precision.
      player_ids: "`player_id` is FFC-internal and bridges to nothing outside FFC (ADR-061)"
      market_rank: "not published; deriving one would invent a field the source does not have"
      selection_pct: "not published"
    aggregation:
      window_type: rolling
      window_days_observed: 7
      observed_window: "2026-08-26 to 2026-09-02"
      contrast: >-
        MyFantasyLeague aggregates the season to date. Both are called "ADP" and they are not
        the same measurement; the quote carries aggregation_window_type so nothing downstream
        can forget (Release 2 guardrail 2.3).
    verified_cohorts_2026:
      standard: {rows: 221, core_rows: 186, deepest_adp: 172.6, total_drafts: 1794}
      half-ppr: {rows: 233, deepest_adp: 188.6, total_drafts: 3142}
      ppr: {rows: 264, deepest_adp: 201.1, total_drafts: 8007}
    identity:
      strategy: generated_alias_only
      alias_file: "config/market-aliases/fantasyfootballcalculator_adp.yaml"
      linkage_rule_version: phase10_linkage_v1
      measured_at: "2026-09-02"
      relevant_rows: 222
      accepted: 222
      coverage: 1.0
      quarantined: 0
      top300_unresolved: 0
      accepted_by_method: {resolved_exact_name_position: 222}
    known_issues:
      - id: teams_accepted_and_ignored
        detail: >-
          `teams=` is accepted and has no effect. Per-player adp and times_drafted are
          byte-identical across 8/10/12/14 in all three formats - zero rows differ in any of
          the nine comparisons, measured in Phase 8 (ADR-056) and reproduced 2026-09-02. FFC
          offers three SCORING cohorts, not twelve scoring x league-size cohorts, and
          league_size is null on every quote with a `league_size_not_observed` flag. A
          semantic check fails the build if any row ever claims one.
      - id: population_smaller_than_300
        detail: >-
          The deepest ADP is 201.1 and the largest cohort is 264 rows including kickers and
          defences. "FFC top 300" therefore means the whole of FFC, which is what the surface
          rule uses: the rule asks for the top of each market, not for a market to have 300
          rows (ADR-063).
      - id: csv_path_is_not_a_csv
        detail: >-
          `/adp/csv/{fmt}.csv` returned content-type text/html and a `<pre>` header row, and
          takes no `year`. The JSON path takes an explicit year and is the reproducible one.

  fantasypros_ecr:
    # IMPLEMENTED, RETAINED, AND NOT PUBLISHED. See ADR-064 for the full record: this is a
    # failed Phase-10 exit criterion, kept visible rather than rounded up.
    policy: verify_before_use
    verified: true
    verified_at: "2026-09-02"
    criticality: optional
    cost: free_tier_insufficient
    decision_ref: "docs/DECISIONS.md ADR-064"
    evidence: "docs/source-probes/2026-09-02/phase10-report.md section 2"
    docs_url: "https://api.fantasypros.com/public/v2/docs"
    api_base_url: "https://api.fantasypros.com/public/v2/json/"
    authentication: api_key_header
    # A NAME, never a value (the ADR-017 convention). Backend Actions only; the browser
    # never receives it and never calls this vendor.
    client_settings:
      api_key_env: FANTASYPROS_API_KEY
      api_key_transport: "x-api-key request header only, never a query string"
      browser_access: false
    verified_endpoints:
      consensus_rankings: "https://api.fantasypros.com/public/v2/json/nfl/{season}/consensus-rankings?position={QB|RB|WR|TE|FLX|ALL}&scoring={STD|HALF|PPR}&type=draft&week=0"
    license: >-
      The project owner reviewed and approved the current FantasyPros terms for this free
      non-commercial project on 2026-08-18 and provisioned an API key. Attribution is
      required wherever the data is used; it is given in the frontend Data view whether or
      not a number is displayed, because a source read server-side is a source used.
    attribution_required: true
    attribution_surface: "frontend Data view, section 07 Sources and attribution"
    published_to_public_artifacts: false
    published_blocked_reason: >-
      The provisioned key is on the FREE tier. Every response carries public_api_limited=true
      and returns exactly ten rows; limit, offset, start, page, max_results and ranks were
      each tried and all eight returned the same ten rows and the same first player. Per
      position that reaches forty distinct players across QB/RB/WR/TE, against a documented
      count of 407 receivers and 225 tight ends alone. A ten-row slice is not a consensus.
    adp_available: false
    adp_unavailable_detail: >-
      `/json/nfl/{season}/adp` answers 403 Missing Authentication Token, and `type=adp` on the
      consensus endpoint returns the ECR row shape with no ADP-like field. A `fantasypros_adp`
      column would have nothing behind it, so the adapter does not emit one.
    roles:
      - expert_consensus_rank
    forbidden_roles:
      - intrinsic_feature
      - draftvalue_input
      - public_artifact_field
      - adp_price
      - adp_aggregate_component
    request_budget:
      daily_cap: 50
      vendor_stated_daily: 100
      min_interval_seconds: 1
      call_plan: "4 positions x 3 scoring cohorts = 12 requests/day"
      cap_rationale: >-
        Roadmap 10.1.3 deliberately halves the vendor's stated allowance for operational
        headroom. Enforced in code by RequestBudget, which refuses to issue request 51.
    response_fields:
      envelope: [sport, type, ranking_type_name, year, week, position_id, scoring, filters, count, total_experts, last_updated, limit, public_api_limited, tier]
      player: [cbs_player_id, player_bye_week, player_ecr_delta, player_eligibility, player_filename, player_id, player_name, player_owned_avg, player_owned_espn, player_owned_yahoo, player_page_url, player_position_id, player_positions, player_short_name, player_team_id, player_yahoo_id, player_yahoo_positions, pos_rank, rank_ave, rank_ecr, rank_max, rank_min, rank_std, sportsdata_id, tier]
    field_notes:
      dispersion: >-
        rank_ave/rank_min/rank_max/rank_std are measured in RANKS across the expert panel,
        not in picks. They occupy consensus_rank_* columns; writing them into min_pick,
        max_pick or adp_sd would put an expert-rank spread under a draft-pick label.
      sample_size: "total_experts, 93-109 observed - the panel is the sample for a ranking"
      source_as_of: >-
        `last_updated` is "9/02": a month and a day, with no year and no time. Retained as
        evidence and never promoted to source_as_of_utc.
      position_all: "rejected as an invalid position UNLESS type=draft&week=0 accompany it"
      valid_positions: "QB, RB, WR, TE, K, OP, FLX, DST, IDP, DL, LB, DB, TK, TQB, TRB, TWR, TTE, TOL, HC, P"
    identity:
      strategy: two_live_bridges_cross_checked
      bridges:
        sportsdata_id: {namespace: sportradar, resolved: "40/40"}
        player_yahoo_id: {namespace: yahoo, resolved: "36/40"}
      needs_name_linkage: false
    scoring_axis_exact: true
    scoring_axis_evidence: "STD, HALF and PPR return genuinely different RB orderings"
    revisit_if:
      - >-
        A key whose responses omit `public_api_limited` (or set it false) and whose `count`
        equals the rows delivered. That exact condition is tested on every capture by
        FantasyProsEcrAdapter.semantic_checks; enabling the source is then a one-line change
        to MarketSourceSpec.publishable.

